<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="NANNAI Confeitaria e Padaria — Food Operations Management System"
    />
    <meta name="theme-color" content="#401E13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NANNAI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>NANNAI — Food Operations Management System</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #fdf8f3;
        color: #401e13;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #app-splash img {
        width: min(72vw, 11rem);
        height: auto;
        object-fit: contain;
      }

      #app-splash p {
        margin: 0;
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.875rem;
        color: #6b4a3a;
      }

      .app-splash-spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid rgb(64 30 19 / 0.15);
        border-top-color: #401e13;
        border-radius: 9999px;
        animation: app-splash-spin 0.8s linear infinite;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-live="polite" aria-busy="true">
      <img src="/brand/nannai-brand-full.webp" alt="NANNAI Confeitaria e Padaria" width="176" height="264" />
      <div class="app-splash-spinner" aria-hidden="true"></div>
      <p>Food Operations Management System</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        var splash = document.getElementById('app-splash')
        if (!splash) return
        splash.classList.add('is-hidden')
        window.setTimeout(function () {
          splash.remove()
        }, 300)
      })
    </script>
  </body>
</html>
