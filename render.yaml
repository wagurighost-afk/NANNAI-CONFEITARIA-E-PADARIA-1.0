# NANNAI — deploy na nuvem (Render.com)
# Site + API + PWA + PostgreSQL (dados persistentes) + disco para uploads

databases:
  - name: nannai-db
    plan: free
    databaseName: nannai
    user: nannai

services:
  - type: web
    name: nannai-app
    runtime: node
    plan: free
    buildCommand: >-
      NPM_CONFIG_PRODUCTION=false npm install &&
      VITE_API_BASE_URL=/api VITE_USE_MOCK=false npm run build &&
      NPM_CONFIG_PRODUCTION=false npm install --prefix server &&
      npm run build --prefix server
    startCommand: NODE_ENV=production npm run start --prefix server
    healthCheckPath: /api/health
    disk:
      name: nannai-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEFAULT_USER_PASSWORD
        value: Nannai@2026
      - key: DATABASE_URL
        fromDatabase:
          name: nannai-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
